name: Refresh TradePilot snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker.py"
      - "spy_agents.py"
      - "universe.txt"
      - "requirements.txt"
      - "backtest.py"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "15 11 * * 1-5"
    - cron: "30,45 12 * * 1-5"
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 13-20 * * 1-5"
concurrency:
  # Keep code-triggered and scheduled refreshes separate. A scheduled refresh
  # must never block the deployment/refresh caused by a code push.
  group: tradepilot-refresh-${{ github.event_name == 'schedule' && 'schedule' || github.run_id }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python worker.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      # Build Advanced from the exact snapshot generated above so the two tabs
      # can never get out of sync because of independent schedules.
      - run: python advanced_worker.py
      # Backtesting is intentionally separate from the frequent dashboard refresh.
      - run: |
          git config user.name tradepilot-bot
          git config user.email tradepilot-bot@users.noreply.github.com
          git add docs/data/snapshot.json docs/data/state.json docs/data/journal.json docs/data/signals.json docs/data/advanced.json
          git diff --cached --quiet || git commit -m 'data: refresh snapshot and backtest'
          # A code/UI push can land while this scanner run is executing.
          # Rebase the generated-data commit onto the latest main before pushing.
          # Never let an obsolete runner overwrite data produced from newer code.
          git fetch origin main
          if [ "$(git rev-parse origin/main:worker.py)" != "$(git rev-parse HEAD:worker.py)" ]; then
            echo "worker.py changed while this run was executing; skip stale snapshot push."
            exit 0
          fi
          # Generated JSON files are intentionally last-writer-wins. Rebase can
          # conflict when two scanner runs update the same snapshot/state files.
          # Refresh onto latest main, then restore this run's generated files.
          mkdir -p /tmp/tradepilot-data
          cp docs/data/snapshot.json /tmp/tradepilot-data/snapshot.json
          cp docs/data/state.json /tmp/tradepilot-data/state.json
          cp docs/data/journal.json /tmp/tradepilot-data/journal.json
          cp docs/data/signals.json /tmp/tradepilot-data/signals.json
          cp docs/data/advanced.json /tmp/tradepilot-data/advanced.json
          git reset --hard origin/main
          cp /tmp/tradepilot-data/*.json docs/data/
          git add docs/data/snapshot.json docs/data/state.json docs/data/journal.json docs/data/signals.json
          git diff --cached --quiet || git commit -m 'data: refresh live scanner'
          git push origin HEAD:main
