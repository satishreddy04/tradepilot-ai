name: Refresh TradePilot snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker.py"
      - "universe.txt"
      - "app.py"
      - "requirements.txt"
      - "backtest.py"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: "15 11 * * 1-5"
    - cron: "30,45 12 * * 1-5"
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 13-20 * * 1-5"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python worker.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python backtest.py
      - run: |
          git config user.name tradepilot-bot
          git config user.email tradepilot-bot@users.noreply.github.com
          git add docs/data/snapshot.json docs/data/backtest.json docs/data/state.json
          git diff --cached --quiet || git commit -m 'data: refresh snapshot and backtest'
          git push
